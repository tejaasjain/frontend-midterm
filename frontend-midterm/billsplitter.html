<!DOCTYPE html>
<html>
<head>
    <title>Bill Splitter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 3px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #555;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #result {
            background: #eee;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            line-height: 2;
        }

        .error {
            color: red;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Bill Splitter</h2>

        <label>Bill amount (Rs.)</label>
        <input type="number" id="bill" placeholder="e.g. 1200">

        <label>Tip</label>
        <select id="tip">
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="5">5%</option>
            <option value="0">0%</option>
        </select>

        <label>Number of people</label>
        <input type="number" id="people" value="4">

        <button onclick="calculateBill()">Calculate</button>

        <div id="result" class="hidden"></div>

    </div>

    <script>
        function calculateBill() {

            let bill = parseFloat(
                document.getElementById("bill").value
            );

            let tip = parseFloat(
                document.getElementById("tip").value
            );

            let people = parseInt(
                document.getElementById("people").value
            );

            let result = document.getElementById("result");

            result.classList.remove("hidden");

            if (
                isNaN(bill) || bill <= 0 ||
                isNaN(people) || people <= 0
            ) {
                result.innerHTML =
                    '<span class="error">Please enter a valid bill and number of people.</span>';
                return;
            }

            let tipAmount = bill * tip / 100;

            let totalBill = bill + tipAmount;

            let perPerson = totalBill / people;

            result.innerHTML = `
                Tip amount: <b>Rs. ${tipAmount.toFixed(2)}</b><br>

                Total bill: <b>Rs. ${totalBill.toFixed(2)}</b><br>

                Each person pays: <b>Rs. ${perPerson.toFixed(2)}</b>
            `;
        }
    </script>

</body>
</html>
